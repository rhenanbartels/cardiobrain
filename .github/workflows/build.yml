name: Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 pyqtgraph numpy pandas scipy
          pip install -r requirements.txt
        shell: pwsh

      - name: Build EXE
        run: |
          python -m PyInstaller CardioBrain.spec
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-windows
          path: dist\CardioBrain.exe
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema (Qt/PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 pyqtgraph numpy pandas scipy
          pip install -r requirements.txt

      - name: Build binário Linux
        run: |
          python -m PyInstaller CardioBrain.spec

      - name: Empacotar binário Linux
        run: |
          tar -czf CardioBrain-linux.tar.gz -C dist CardioBrain

      - name: Upload binário Linux
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-linux
          path: CardioBrain-linux.tar.gz
          retention-days: 30

  build-macos:
    name: macOS (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 pyqtgraph numpy pandas scipy
          pip install -r requirements.txt

      - name: Build binário macOS
        run: |
          python -m PyInstaller CardioBrain.spec

      - name: Empacotar binário macOS
        run: |
          ditto -c -k --keepParent dist/CardioBrain CardioBrain-macos-arm64.zip

      - name: Upload binário macOS
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-macos-arm64
          path: CardioBrain-macos-arm64.zip
          retention-days: 30
