name: Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

# Opções comuns do PyInstaller; o .spec é gerado no próprio build.
# Cada job acrescenta as opções específicas do SO.
env:
  PYI_ARGS: >-
    main.py
    --name CardioBrain
    --windowed
    --noconfirm
    --add-data icons/brain.ico:.
    --collect-submodules PySide6.QtWidgets
    --collect-submodules PySide6.QtGui
    --collect-submodules PySide6.QtCore
    --exclude-module PyQt6

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
        shell: pwsh

      - name: Build EXE
        run: |
          python -m PyInstaller ${{ env.PYI_ARGS }} --onefile --icon icons/brain.ico
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-windows
          path: dist\CardioBrain.exe
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema (Qt/PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build binário Linux
        run: |
          python -m PyInstaller ${{ env.PYI_ARGS }} --onefile

      - name: Empacotar binário Linux
        run: |
          tar -czf CardioBrain-linux.tar.gz -C dist CardioBrain

      - name: Upload binário Linux
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-linux
          path: CardioBrain-linux.tar.gz
          retention-days: 30

  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel (GitHub suporta até o fim do macOS 15, ~2027)
            arch: x86_64

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          # pillow: PyInstaller usa para converter o .png em .icns no macOS
          pip install pyinstaller pillow
          pip install -r requirements.txt

      # onedir + --windowed gera dist/CardioBrain.app (mesmo resultado do build local)
      - name: Build app macOS
        run: |
          python -m PyInstaller ${{ env.PYI_ARGS }} --icon icons/brain.png

      - name: Empacotar .app
        run: |
          # ditto preserva symlinks e permissões dos frameworks Qt
          ditto -c -k --keepParent dist/CardioBrain.app CardioBrain-macos-${{ matrix.arch }}.zip

      - name: Upload app macOS
        uses: actions/upload-artifact@v4
        with:
          name: CardioBrain-macos-${{ matrix.arch }}
          path: CardioBrain-macos-${{ matrix.arch }}.zip
          retention-days: 30
